<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot — Demo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .chat-card {
      background: white;
      border-radius: 16px;
      border: 1px solid #e5e5ea;
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }

    .chat-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid #f0f0f0;
    }

    .bot-avatar {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: #eff6ff;
      display: flex; align-items: center; justify-content: center;
      color: #3b82f6;
      font-size: 18px;
    }

    .bot-name { font-size: 14px; font-weight: 600; color: #1c1c1e; }
    .bot-status { font-size: 11px; color: #34c759; display: flex; align-items: center; gap: 4px; margin-top: 2px; }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; background: #34c759; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .messages {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      min-height: 300px;
      max-height: 380px;
      overflow-y: auto;
    }

    .msg { display: flex; gap: 8px; animation: fadeUp 0.25s ease; }
    .msg.user { flex-direction: row-reverse; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(5px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-av {
      width: 26px; height: 26px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 600;
      margin-top: 2px;
    }
    .msg-av.bot  { background: #eff6ff; color: #3b82f6; }
    .msg-av.user { background: #f2f2f7; color: #8e8e93; }

    .bubble {
      max-width: 80%;
      padding: 9px 13px;
      border-radius: 16px;
      font-size: 13.5px;
      line-height: 1.6;
    }
    .bubble.bot  { background: #f2f2f7; color: #1c1c1e; border-bottom-left-radius: 4px; }
    .bubble.user { background: #3b82f6; color: white; border-bottom-right-radius: 4px; }

    .typing { display: flex; gap: 4px; align-items: center; }
    .typing span {
      width: 5px; height: 5px; border-radius: 50%;
      background: #8e8e93;
      animation: blink 1.1s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.18s; }
    .typing span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes blink {
      0%,80%,100% { opacity: 0.3; transform: scale(0.85); }
      40% { opacity: 1; transform: scale(1); }
    }

    .chips {
      display: flex; flex-wrap: wrap; gap: 5px;
      margin-top: 7px;
    }
    .chip {
      padding: 4px 10px;
      border-radius: 20px;
      border: 1px solid #e5e5ea;
      font-size: 11px;
      color: #3b82f6;
      background: white;
      cursor: pointer;
      transition: all 0.15s;
      font-family: inherit;
    }
    .chip:hover { background: #eff6ff; border-color: #3b82f6; }

    .input-row {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      border-top: 1px solid #f0f0f0;
      align-items: center;
    }

    .input-row input {
      flex: 1;
      height: 36px;
      padding: 0 12px;
      border-radius: 20px;
      border: 1px solid #e5e5ea;
      background: #f9f9fb;
      font-size: 13.5px;
      outline: none;
      font-family: inherit;
      color: #1c1c1e;
      transition: border-color 0.15s;
    }
    .input-row input:focus { border-color: #3b82f6; background: white; }
    .input-row input::placeholder { color: #aeaeb2; }

    .send-btn {
      width: 36px; height: 36px;
      border-radius: 50%;
      border: none;
      background: #3b82f6;
      color: white;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 15px;
      transition: background 0.15s, transform 0.1s;
      flex-shrink: 0;
    }
    .send-btn:hover:not(:disabled) { background: #2563eb; }
    .send-btn:active { transform: scale(0.95); }
    .send-btn:disabled { background: #d1d5db; cursor: not-allowed; }

    .powered {
      text-align: center;
      padding: 8px;
      font-size: 10px;
      color: #aeaeb2;
      border-top: 1px solid #f5f5f5;
    }
  </style>
</head>
<body>

<div class="chat-card">
  <div class="chat-header">
    <div class="bot-avatar"><i class="ti ti-robot"></i></div>
    <div>
      <div class="bot-name">AI Assistant</div>
      <div class="bot-status"><span class="status-dot"></span> Online</div>
    </div>
  </div>

  <div class="messages" id="msgs"></div>

  <div class="input-row">
    <input id="inp" type="text" placeholder="Type a message..."
           onkeydown="if(event.key==='Enter') send()" />
    <button class="send-btn" id="btn" onclick="send()" aria-label="Send">
      <i class="ti ti-send"></i>
    </button>
  </div>

  <div class="powered">Powered by AI — Demo Mode</div>
</div>

<script>
  // ===============================================================
  // MOCK RESPONSES — No API key needed!
  // Customize these replies for your startup
  // ===============================================================
  const RESPONSES = [
    {
      keywords: ['hello', 'hi', 'hey', 'assalam', 'salam'],
      reply: "Hello! Great to have you here. I'm your AI assistant — ask me anything about our services, pricing, or how to get started!",
      chips: ['What can you do?', 'Pricing?', 'Get started']
    },
    {
      keywords: ['service', 'what can', 'what do', 'offer', 'help', 'kya'],
      reply: "We build smart AI solutions — chatbots, automation workflows, and custom AI agents. Our tools help businesses save time and grow faster.",
      chips: ['Pricing?', 'How to start?', 'See examples']
    },
    {
      keywords: ['price', 'cost', 'pricing', 'plan', 'kitna', 'paisa'],
      reply: "We offer flexible plans starting from just $29/month. There's also a free demo so you can try before you buy!",
      chips: ['Free plan?', 'Enterprise?', 'Contact us']
    },
    {
      keywords: ['free', 'trial', 'demo'],
      reply: "Yes! We have a free demo with no credit card required. You can explore all features for 7 days completely free.",
      chips: ['Start free trial', 'Pricing plans', 'Contact us']
    },
    {
      keywords: ['start', 'begin', 'how', 'signup', 'sign up', 'register'],
      reply: "Getting started is easy! Just sign up, tell us about your business, and we'll have your AI assistant ready within 24 hours.",
      chips: ['Pricing?', 'Contact us', 'Learn more']
    },
    {
      keywords: ['contact', 'email', 'reach', 'talk', 'human', 'agent'],
      reply: "You can reach our team at hello@yourstartup.com or book a free 15-minute call. We usually respond within a few hours!",
      chips: ['Pricing?', 'What can you do?', 'Get started']
    },
    {
      keywords: ['time', 'long', 'fast', 'quick', 'kitne din', 'timeline'],
      reply: "Setup is quick! A basic chatbot is ready in 1-2 days. Custom AI agents with full integrations take about 1-2 weeks.",
      chips: ['Pricing?', 'Get started', 'Contact us']
    },
    {
      keywords: ['example', 'portfolio', 'work', 'project', 'sample'],
      reply: "We've built AI assistants for e-commerce stores, SaaS companies, and agencies. This chatbot you're talking to is one of our demos!",
      chips: ['Pricing?', 'How to start?', 'Contact us']
    },
    {
      keywords: ['enterprise', 'big', 'large', 'team', 'company'],
      reply: "Our Enterprise plan includes unlimited users, priority support, custom integrations, and a dedicated account manager. Let's talk!",
      chips: ['Contact us', 'Pricing?', 'Get started']
    },
    {
      keywords: ['thanks', 'thank', 'shukriya', 'great', 'nice', 'good', 'awesome'],
      reply: "You're welcome! Feel free to ask anything else. I'm here to help anytime.",
      chips: ['What can you do?', 'Pricing?', 'Get started']
    }
  ];

  const DEFAULT_REPLY = {
    reply: "That's a great question! For detailed info, our team would love to help. You can also explore our services and pricing above.",
    chips: ['What can you do?', 'Pricing?', 'Contact us']
  };

  // ===============================================================

  const msgsEl = document.getElementById('msgs');
  const inpEl  = document.getElementById('inp');
  const btnEl  = document.getElementById('btn');
  let busy = false;

  function addBubble(role, text) {
    const row = document.createElement('div');
    row.className = 'msg ' + (role === 'user' ? 'user' : '');

    const av = document.createElement('div');
    av.className = 'msg-av ' + (role === 'user' ? 'user' : 'bot');
    av.textContent = role === 'user' ? 'U' : 'AI';

    const bub = document.createElement('div');
    bub.className = 'bubble ' + (role === 'user' ? 'user' : 'bot');
    bub.textContent = text;

    row.appendChild(av);
    row.appendChild(bub);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
    return bub;
  }

  function addTyping() {
    const row = document.createElement('div');
    row.className = 'msg'; row.id = 'typing';
    const av = document.createElement('div');
    av.className = 'msg-av bot'; av.textContent = 'AI';
    const bub = document.createElement('div');
    bub.className = 'bubble bot';
    bub.innerHTML = '<div class="typing"><span></span><span></span><span></span></div>';
    row.appendChild(av); row.appendChild(bub);
    msgsEl.appendChild(row);
    msgsEl.scrollTop = msgsEl.scrollHeight;
  }

  function removeTyping() {
    const t = document.getElementById('typing');
    if (t) t.remove();
  }

  function addChips(bub, chips) {
    const div = document.createElement('div');
    div.className = 'chips';
    chips.forEach(label => {
      const btn = document.createElement('button');
      btn.className = 'chip';
      btn.textContent = label;
      btn.onclick = () => { inpEl.value = label; send(); };
      div.appendChild(btn);
    });
    bub.appendChild(div);
  }

  function getResponse(text) {
    const low = text.toLowerCase();
    for (const r of RESPONSES) {
      if (r.keywords.some(k => low.includes(k))) return r;
    }
    return DEFAULT_REPLY;
  }

  function send() {
    const text = inpEl.value.trim();
    if (!text || busy) return;

    inpEl.value = '';
    busy = true;
    btnEl.disabled = true;

    addBubble('user', text);
    addTyping();

    // Realistic typing delay (1-2 seconds)
    const delay = 1000 + Math.random() * 800;

    setTimeout(() => {
      removeTyping();
      const res = getResponse(text);
      const bub = addBubble('assistant', res.reply);
      if (res.chips) addChips(bub, res.chips);
      busy = false;
      btnEl.disabled = false;
      inpEl.focus();
    }, delay);
  }

  // Initial greeting
  (function init() {
    const bub = addBubble('assistant', "Hi! I'm your AI assistant. How can I help you today?");
    addChips(bub, ['What can you do?', 'Pricing?', 'Get started']);
  })();
</script>

</body>
</html>
